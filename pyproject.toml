[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "myerson"
dynamic = ["version", "description"]
authors = [
  { name="Samuel K. R. Homberg", email="samuel.homberg@uni-muenster.de" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  'tqdm',
  'numpy >= 1.25',
  'networkx >= 3.1',
]

[project.optional-dependencies]
docs = [
    "sphinx_rtd_theme",
    "sphinx",
]
test = ["pytest"]
explain = [
    "torch_geometric >= 2.3.1, < 3",
    "torch >= 2.0.1, < 3",
]
chemprop = [
    "chemprop >= 2, < 3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "chemprop: requires the optional chemprop backend and its checkpoints",
    "pyg: requires torch_geometric and the PyG test checkpoints",
    "slow: loads model checkpoints / runs GNN forwards",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
myerson = { workspace = true }

[dependency-groups]
dev = [
    "myerson[chemprop,explain,test]",
    "ipykernel",
    "jupyter",
    "matplotlib",
]

[project.urls]
Source = "https://github.com/kochgroup/myerson"
Documentation = "https://myerson.readthedocs.io/en/latest/"
